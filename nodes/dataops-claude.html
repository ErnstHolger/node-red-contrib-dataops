<style>
    .dataops-white-text { fill: #ffffff !important; }
    .red-ui-palette-node[data-palette-type="dataops-claude"] .red-ui-palette-label { color: #ffffff !important; }
</style>
<script type="text/javascript">
    RED.nodes.registerType('dataops-claude', {
        category: 'data ops',
        color: '#054E4E',
        defaults: {
            name: { value: "" },
            apiConfig: { value: "", type: "dataops-claude-api", required: true },
            systemPrompt: { value: "" },
            sourceScope: { value: "global", required: true },
            sourceKey: { value: "", required: true },
            specScope: { value: "global", required: true },
            specKey: { value: "dataopsSpecs", required: true },
            maxSampleRows: { value: 250, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["result", "error"],
        icon: "font-awesome/fa-commenting",
        label: function() { return this.name || "claude"; },
        labelStyle: function() { return (this.name ? "node_label_italic" : "") + " dataops-white-text"; },
        paletteLabel: "claude"
    });
</script>

<script type="text/html" data-template-name="dataops-claude">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-apiConfig"><i class="fa fa-commenting"></i> Claude API</label>
        <input type="text" id="node-input-apiConfig">
        <div class="form-tips">API configuration node with credentials and model settings.</div>
    </div>
    <div class="form-row">
        <label for="node-input-systemPrompt" style="align-self:flex-start;padding-top:8px;"><i class="fa fa-pencil"></i> System Prompt</label>
        <textarea id="node-input-systemPrompt" rows="6" style="width:100%;box-sizing:border-box;font-family:monospace;"
            placeholder="Leave empty to use the built-in IIoT normalization prompt."></textarea>
        <div class="form-tips">System prompt that sets Claude's role. Leave empty for no system prompt.</div>
    </div>

    <div class="form-row" style="margin-bottom:0;">
        <label style="width:auto;font-weight:bold;"><i class="fa fa-sign-in"></i> Source</label>
        <span class="form-tips" style="display:inline;margin-left:4px;">Cache samples to analyze, read from <code>&lt;scope&gt;.&lt;key&gt;</code> (the dict <code>dataops-in</code> writes to context).</span>
    </div>
    <div class="form-row">
        <label for="node-input-sourceScope"><i class="fa fa-globe"></i> Spec Scope</label>
        <select id="node-input-sourceScope" style="width:70%;">
            <option value="global">global</option>
            <option value="flow">flow</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-sourceKey"><i class="fa fa-key"></i> Spec Key</label>
        <input type="text" id="node-input-sourceKey" placeholder="(cache name, e.g. dataopsCache)">
    </div>

    <div class="form-row" style="margin-bottom:0;">
        <label style="width:auto;font-weight:bold;"><i class="fa fa-sign-out"></i> Destination</label>
        <span class="form-tips" style="display:inline;margin-left:4px;">Generated specs merged into <code>&lt;scope&gt;.&lt;key&gt;</code>. Consumed by <code>dataops-transform</code> — use the same Scope &amp; Spec Key there.</span>
    </div>
    <div class="form-row">
        <label for="node-input-specScope"><i class="fa fa-globe"></i> Spec Scope</label>
        <select id="node-input-specScope" style="width:70%;">
            <option value="global">global</option>
            <option value="flow">flow</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-specKey"><i class="fa fa-key"></i> Spec Key</label>
        <input type="text" id="node-input-specKey" placeholder="dataopsSpecs">
    </div>

    <div class="form-row">
        <label for="node-input-maxSampleRows"><i class="fa fa-list-ol"></i> Sample Rows</label>
        <input type="number" id="node-input-maxSampleRows" placeholder="250" min="1">
        <div class="form-tips">Max source entries sent to the LLM per call. If the source has more, only the first N are included. Default 250.</div>
    </div>
</script>

<script type="text/html" data-help-name="dataops-claude">
    <h3>Summary</h3>
    <p>Reads cache samples from a context dictionary, sends them to the Anthropic Claude API to generate per-topic normalization specs, and merges the result into a destination context dictionary consumed by <code>dataops-transform</code>.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Claude API</dt>
        <dd>The <code>dataops-claude-api</code> config node with API credentials.</dd>
        <dt>System Prompt</dt>
        <dd>Sets Claude's role/behavior. Optional. Shown as <code>system</code> in the API call.</dd>
        <dt>Source (Spec Scope + Key)</dt>
        <dd>Context location of the cache samples to analyze — <code>&lt;scope&gt;.&lt;key&gt;</code>. This is the dictionary <code>dataops-in</code> writes to context, shaped <code>{ topic: { payload, ts, metadata } }</code>. Use the same Scope &amp; Spec Key as the <code>dataops-in</code> node.</dd>
        <dt>Destination (Spec Scope + Key)</dt>
        <dd>Context location the generated spec dictionary is merged into. Point <code>dataops-transform</code> at the same Scope &amp; Spec Key.</dd>
        <dt>Sample Rows</dt>
        <dd>Max source entries sent per call (default 250).</dd>
    </dl>

    <h3>Input</h3>
    <p>The node triggers on any incoming message. If <code>msg.payload</code> is a string, it is used as the complete user message sent to Claude (overriding the default prompt). Otherwise, a default prompt is generated that encodes the source samples as TOON and asks Claude to produce per-topic specs.</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>Output 1 (result)</dt>
        <dd><code>msg.payload</code> — Claude's response content (array of content blocks).<br>
        <code>msg._claude</code> — Metadata: model, usage (tokens), duration_ms, cache_size, stop_reason.</dd>
        <dt>Output 2 (error)</dt>
        <dd><code>msg.payload.error</code> — Error message if the API call or processing fails.<br>
        <code>msg._error</code> — Set to true.</dd>
    </dl>

</script>
