<style>
    .dataops-white-text { fill: #ffffff !important; }
    .red-ui-palette-node[data-palette-type="dataops-split"] .red-ui-palette-label { color: #ffffff !important; }
</style>
<script type="text/javascript">
    RED.nodes.registerType('dataops-split', {
        category: 'data ops',
        color: '#054E4E',
        defaults: {
            name:                { value: "" },
            topicFilter:         { value: "" },
            fields:              { value: '[\n  {"name": "T", "type": "number"},\n  {"name": "H", "type": "number"}\n]' },
            timestampExpr:       { value: "" },
            qualityExpr:         { value: "" },
            passthroughNonMatch: { value: false },
            autoDetect:          { value: false }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["split records", "passthrough / error"],
        icon: "font-awesome/fa-columns",
        label: function() { return this.name || "split"; },
        labelStyle: function() { return (this.name ? "node_label_italic" : "") + " dataops-white-text"; },
        paletteLabel: "split",
        oneditprepare: function() {
            var toggleFields = function() {
                var auto = $('#node-input-autoDetect').is(':checked');
                $('.row-fields').toggle(!auto);
            };
            $('#node-input-autoDetect').on('change', toggleFields).trigger('change');
        }
    });
</script>

<script type="text/html" data-template-name="dataops-split">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-topicFilter"><i class="fa fa-filter"></i> Topic Filter</label>
        <input type="text" id="node-input-topicFilter" placeholder="plant/HWS/Denis  |  plant/+/Denis  |  # (all)">
        <div class="form-tips">MQTT-style filter. <code>+</code> = one segment, <code>#</code> = multi-level wildcard. Empty matches all.</div>
    </div>
    <div class="form-row" style="margin-bottom:6px;">
        <label style="width:auto;font-weight:normal;">
            <input type="checkbox" id="node-input-autoDetect" style="width:auto;vertical-align:top;">
            Auto-detect all keys in payload (ignores Fields below)
        </label>
    </div>
    <div class="form-row row-fields" style="margin-bottom:6px;">
        <label for="node-input-fields" style="align-self:flex-start;padding-top:8px;"><i class="fa fa-list-alt"></i> Fields</label>
    </div>
    <div class="form-row row-fields">
        <textarea id="node-input-fields" rows="8" style="width:100%;font-family:monospace;font-size:12px;"></textarea>
        <div class="form-tips">JSON array. Each entry: <code>{"name": "&lt;output-name&gt;", "type": "&lt;number|integer|string|boolean|object&gt;", "path": "&lt;dot-path-in-payload&gt;"}</code>. <code>path</code> defaults to <code>name</code>. The output topic is <code>&lt;input-topic&gt;/&lt;name&gt;</code>.</div>
    </div>
    <div class="form-row">
        <label for="node-input-timestampExpr"><i class="fa fa-clock-o"></i> Timestamp</label>
        <input type="text" id="node-input-timestampExpr" placeholder="$millis()  |  payload.ts  |  $toMillis(payload.sourceTimestamp)">
        <div class="form-tips">JSONata expression. Empty → <code>msg.timestamp</code> if set, else current time.</div>
    </div>
    <div class="form-row">
        <label for="node-input-qualityExpr"><i class="fa fa-check-circle"></i> Quality</label>
        <input type="text" id="node-input-qualityExpr" placeholder="true  |  payload.statusCode = 0">
        <div class="form-tips">JSONata expression. Empty → <code>msg.quality</code> if set, else <code>true</code>.</div>
    </div>
    <div class="form-row">
        <label style="width:auto;font-weight:normal;">
            <input type="checkbox" id="node-input-passthroughNonMatch" style="width:auto;vertical-align:top;">
            Pass non-matching messages through to output 2
        </label>
    </div>
</script>

<script type="text/html" data-help-name="dataops-split">
    <h3>Summary</h3>
    <p>Explodes a wide message (one payload with many tags) into N narrow normalized records — one per configured field, on output 1.</p>

    <h3>Example</h3>
    <p>With <b>Topic Filter</b> = <code>plant/HWS/Denis</code> and <b>Fields</b>:</p>
    <pre>[
  {"name": "T", "type": "number"},
  {"name": "H", "type": "number"},
  {"name": "P", "type": "number", "path": "pressure"},
  {"name": "alarm", "type": "boolean", "path": "alarmActive"}
]</pre>
    <p>An input message:</p>
    <pre>{
  "topic":   "plant/HWS/Denis",
  "payload": { "T": 25.4, "H": 60.2, "pressure": 1013, "alarmActive": false, "ts": 1716636000000 }
}</pre>
    <p>Produces four output messages on output 1:</p>
    <pre>{ "topic": "plant/HWS/Denis/T",     "payload": { "name": "T",     "type": "number",  "timestamp": ..., "value": 25.4,  "quality": true } }
{ "topic": "plant/HWS/Denis/H",     "payload": { "name": "H",     "type": "number",  "timestamp": ..., "value": 60.2,  "quality": true } }
{ "topic": "plant/HWS/Denis/P",     "payload": { "name": "P",     "type": "number",  "timestamp": ..., "value": 1013,  "quality": true } }
{ "topic": "plant/HWS/Denis/alarm", "payload": { "name": "alarm", "type": "boolean", "timestamp": ..., "value": false, "quality": true } }</pre>

    <h3>Type Coercion</h3>
    <p>Each extracted value is coerced into the declared <code>type</code>. Coercion failure produces <code>null</code> rather than dropping the message. Supported types: <code>number</code>, <code>integer</code>, <code>string</code>, <code>boolean</code>, <code>object</code> (and common aliases like <code>float</code>, <code>int</code>, <code>bool</code>).</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>Output 1 — split records</dt>
        <dd>One message per configured field, payload = <code>{name, type, timestamp, value, quality}</code>.</dd>
        <dt>Output 2 — passthrough / error</dt>
        <dd>Non-matching topics (if <i>Pass non-matching</i> is checked) or evaluation errors.</dd>
    </dl>
</script>
