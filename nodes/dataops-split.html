<script type="text/javascript">
    RED.nodes.registerType('dataops-split', {
        category: 'data ops',
        color: '#4A7C59',
        defaults: {
            name: { value: "" },
            splitMode: { value: "fields" },
            fieldGroups: { value: [] },
            arrayPath: { value: "payload" },
            includeContext: { value: "" }
        },
        inputs: 1,
        outputs: 4,
        outputLabels: ["output 1", "output 2", "output 3", "output 4"],
        icon: "font-awesome/fa-columns",
        label: function() {
            return this.name || "dataops split";
        },
        paletteLabel: "dataops split",
        oneditprepare: function() {
            const node = this;

            function updateModeUI() {
                const mode = $("#node-input-splitMode").val();
                $(".fields-mode-row").toggle(mode === "fields");
                $(".array-mode-row").toggle(mode === "array");
            }
            $("#node-input-splitMode").on("change", updateModeUI);

            // Field groups editable list
            const groupList = $("#node-input-fieldGroups-list").css({
                'min-height': '120px',
                'min-width': '500px'
            }).editableList({
                addItem: function(container, i, data) {
                    const row = $('<div/>', { style: "display:flex; align-items:center; gap:4px; margin-bottom:3px;" }).appendTo(container);

                    // Output number label
                    $('<span/>', { style: "flex:0 0 auto; min-width:60px; font-weight:bold;" })
                        .text("Output " + (i + 1) + ":")
                        .appendTo(row);

                    $('<input/>', {
                        type: "text",
                        placeholder: "field names",
                        class: "group-fields"
                    })
                    .css({ flex: "1 1 auto" })
                    .val(data.fields || "")
                    .appendTo(row);

                    $('<input/>', {
                        type: "text",
                        placeholder: "topic",
                        class: "group-topic"
                    })
                    .css({ flex: "1 1 auto" })
                    .val(data.topic || "")
                    .appendTo(row);

                    $('<input/>', {
                        type: "text",
                        placeholder: "table",
                        class: "group-table"
                    })
                    .css({ flex: "0 1 auto", width: "100px" })
                    .val(data.table || "")
                    .appendTo(row);
                },
                removable: true,
                addButton: true
            });

            if (node.fieldGroups && node.fieldGroups.length > 0) {
                node.fieldGroups.forEach(function(g) {
                    groupList.editableList('addItem', g);
                });
            } else {
                groupList.editableList('addItem', { fields: 'temp, humidity', topic: 'sensors/environment', table: 'env_readings' });
                groupList.editableList('addItem', { fields: 'pressure, flow', topic: 'sensors/process', table: 'process_readings' });
            }

            // Defer UI mode update so the DOM is ready
            setTimeout(updateModeUI, 100);
        },
        oneditsave: function() {
            const node = this;
            node.fieldGroups = [];

            $("#node-input-fieldGroups-list").editableList('items').each(function() {
                const fields = $(this).find(".group-fields").val().trim();
                const topic = $(this).find(".group-topic").val().trim();
                const table = $(this).find(".group-table").val().trim();
                if (fields) {
                    node.fieldGroups.push({ fields: fields, topic: topic, table: table });
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="dataops-split">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-splitMode"><i class="fa fa-cog"></i> Split Mode</label>
        <select id="node-input-splitMode" style="width:70%;">
            <option value="fields">Field Extraction</option>
            <option value="array">Array Expansion</option>
        </select>
    </div>

    <!-- Field extraction mode -->
    <div class="fields-mode-row">
        <div class="form-row">
            <label style="width:100%;"><i class="fa fa-list-alt"></i> Field Groups</label>
            <ol id="node-input-fieldGroups-list"></ol>
            <div class="form-tips">
                <b>Fields</b>: comma-separated field names from payload.
                <b>Topic</b>: output topic for this group.
                <b>Table</b>: sets <code>msg._table</code>. Up to 4 groups (one per output).
            </div>
        </div>
    </div>

    <!-- Array expansion mode -->
    <div class="array-mode-row" style="display:none;">
        <div class="form-row">
            <label for="node-input-arrayPath"><i class="fa fa-list"></i> Array Path</label>
            <input type="text" id="node-input-arrayPath" placeholder="payload">
            <div class="form-tips">Message property path to the array. Default: <code>msg.payload</code>.</div>
        </div>
        <div class="form-row">
            <label for="node-input-includeContext"><i class="fa fa-copy"></i> Include Context Fields</label>
            <input type="text" id="node-input-includeContext" placeholder="e.g. device_id, timestamp">
            <div class="form-tips">Comma-separated fields from the parent payload to include in each array element message.</div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="dataops-split">
    <h3>Summary</h3>
    <p>Splits wide messages into narrower ones. Two modes: field extraction and array expansion.</p>

    <h3>Field Extraction Mode</h3>
    <p>Define up to 4 output groups. Each group specifies which fields from the input payload go into that output. Each output can have its own topic and table.</p>

    <h4>Example</h4>
    <pre>
Input payload:
  { temp: 25.5, humidity: 60, pressure: 1013, flow: 42 }

Group 1: fields="temp, humidity" topic="sensors/env" table="env"
Group 2: fields="pressure, flow" topic="sensors/process" table="process"

Output 1: { topic: "sensors/env",     payload: { temp: 25.5, humidity: 60 } }
Output 2: { topic: "sensors/process", payload: { pressure: 1013, flow: 42 } }
    </pre>

    <h3>Array Expansion Mode</h3>
    <p>Expands an array within the message into individual messages, one per element. Optionally includes context fields from the parent payload.</p>

    <h4>Example</h4>
    <pre>
Input:
  msg.payload = {
    device_id: "D1",
    readings: [{ ts: "12:00", value: 25 }, { ts: "12:01", value: 26 }]
  }

Array path: "payload.readings"
Include context: "device_id"

Output messages:
  { payload: { device_id: "D1", ts: "12:00", value: 25 } }
  { payload: { device_id: "D1", ts: "12:01", value: 26 } }
    </pre>

    <h3>Outputs</h3>
    <p><b>Field mode</b>: Each field group maps to one output (up to 4).</p>
    <p><b>Array mode</b>: All messages sent to output 1 sequentially.</p>
</script>
