<style>
    .dataops-white-text { fill: #ffffff !important; }
    .red-ui-palette-node[data-palette-type="dataops-combine"] .red-ui-palette-label { color: #ffffff !important; }
</style>
<script type="text/javascript">
    RED.nodes.registerType('dataops-combine', {
        category: 'data ops',
        color: '#054E4E',
        defaults: {
            name:           { value: "" },
            triggerMode:    { value: "event", required: true },
            intervalMs:     { value: 1000, validate: RED.validators.number() },
            expectedNames:  { value: "" },
            outputTopic:    { value: "dataops/combined" },
            tsField:        { value: "ts" },
            includeQuality: { value: false }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["combined", "error"],
        icon: "font-awesome/fa-object-group",
        label: function() { return this.name || "combine"; },
        labelStyle: function() { return (this.name ? "node_label_italic" : "") + " dataops-white-text"; },
        paletteLabel: "combine",
        oneditprepare: function() {
            $('#node-input-triggerMode').on('change', function() {
                var mode = $(this).val();
                $('.row-interval').toggle(mode === 'interval');
                $('.row-expected').toggle(mode === 'quorum');
            }).trigger('change');
        }
    });
</script>

<script type="text/html" data-template-name="dataops-combine">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-triggerMode"><i class="fa fa-bolt"></i> Trigger</label>
        <select id="node-input-triggerMode" style="width:70%;">
            <option value="event">event — emit on every input (always-current)</option>
            <option value="interval">interval — emit every N ms</option>
            <option value="quorum">quorum — emit when all expected names arrived, then reset</option>
        </select>
    </div>
    <div class="form-row row-interval">
        <label for="node-input-intervalMs"><i class="fa fa-clock-o"></i> Interval (ms)</label>
        <input type="number" id="node-input-intervalMs" placeholder="1000" min="50">
    </div>
    <div class="form-row row-expected">
        <label for="node-input-expectedNames"><i class="fa fa-list"></i> Expected Names</label>
        <input type="text" id="node-input-expectedNames" placeholder="T, H, P, alarm">
        <div class="form-tips">Comma-separated list. Quorum emits once all listed names have appeared in the buffer.</div>
    </div>
    <div class="form-row">
        <label for="node-input-outputTopic"><i class="fa fa-share"></i> Output Topic</label>
        <input type="text" id="node-input-outputTopic" placeholder="dataops/combined">
    </div>
    <div class="form-row">
        <label for="node-input-tsField"><i class="fa fa-clock-o"></i> Timestamp Key</label>
        <input type="text" id="node-input-tsField" placeholder="ts">
        <div class="form-tips">Output dict key for the latest input timestamp. Default <code>ts</code>.</div>
    </div>
    <div class="form-row">
        <label style="width:auto;font-weight:normal;">
            <input type="checkbox" id="node-input-includeQuality" style="width:auto;vertical-align:top;">
            Include quality fields as <code>&lt;name&gt;_q</code> in output
        </label>
    </div>
</script>

<script type="text/html" data-help-name="dataops-combine">
    <h3>Summary</h3>
    <p>Collects narrow normalized records (one per <code>name</code>) and emits a single wide flat dictionary on output 1.</p>

    <h3>Input</h3>
    <p>Each input message must carry the canonical record shape:</p>
    <pre>msg.payload = { name, type, timestamp, value, quality }</pre>
    <p>(This is what <code>dataops-transform</code> and <code>dataops-split</code> produce.) The node buffers the latest record per <code>name</code>.</p>

    <h3>Trigger Modes</h3>
    <dl class="message-properties">
        <dt>event</dt>
        <dd>Emit on every input — output is always the freshest snapshot of all names seen so far.</dd>
        <dt>interval</dt>
        <dd>Emit every N milliseconds (default 1000). Useful for downstream sinks that want a steady cadence regardless of input rate.</dd>
        <dt>quorum</dt>
        <dd>Emit once all <i>expected names</i> have been seen, then clear the buffer. Useful when assembling a complete record from synchronized sources.</dd>
    </dl>
    <p>A message with <code>msg.cmd = "emit"</code> always forces an emit, regardless of mode.</p>

    <h3>Example Output</h3>
    <pre>{
  "topic": "dataops/combined",
  "payload": {
    "T":     25.4,
    "H":     60.2,
    "P":     1013,
    "alarm": false,
    "ts":    1716636002000
  },
  "_names":   ["T", "H", "P", "alarm"],
  "_trigger": "event"
}</pre>
    <p><code>ts</code> is the latest input timestamp across all buffered records (rename via <i>Timestamp Key</i>).</p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>Output 1 — combined</dt>
        <dd>The flat snapshot dict.</dd>
        <dt>Output 2 — error</dt>
        <dd>Malformed input (missing <code>name</code>) or other errors.</dd>
    </dl>
</script>
