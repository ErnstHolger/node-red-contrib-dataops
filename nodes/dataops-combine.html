<script type="text/javascript">
    RED.nodes.registerType('dataops-combine', {
        category: 'data ops',
        color: '#4A7C59',
        defaults: {
            name: { value: "" },
            cache: { value: "", type: "dataops-cache", required: true },
            inputMappings: { value: [] },
            joinKey: { value: "" },
            windowMs: { value: 0, validate: RED.validators.number() },
            outputTopic: { value: "dataops/combined" },
            table: { value: "" },
            triggerMode: { value: "event" },
            intervalMs: { value: 60000, validate: RED.validators.number() },
            cronExpr: { value: "" }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["combined", "status"],
        icon: "font-awesome/fa-object-group",
        label: function() {
            return this.name || "dataops combine";
        },
        paletteLabel: "dataops combine",
        oneditprepare: function() {
            const node = this;
            let cachedKeys = [];

            function fetchKeys() {
                const cacheId = $("#node-input-cache").val();
                if (cacheId) {
                    $.getJSON("dataops-cache/" + cacheId + "/keys", function(keys) {
                        cachedKeys = keys || [];
                        $(".input-topic").each(function() {
                            $(this).autocomplete("option", "source", cachedKeys);
                        });
                    });
                }
            }

            $("#node-input-cache").on("change", fetchKeys);
            setTimeout(fetchKeys, 100);

            // Toggle interval/cron visibility
            function updateTriggerUI() {
                const mode = $("#node-input-triggerMode").val();
                $(".trigger-interval-row").toggle(mode === "interval");
                $(".trigger-cron-row").toggle(mode === "interval");
            }
            $("#node-input-triggerMode").on("change", updateTriggerUI);
            setTimeout(updateTriggerUI, 100);

            // Input mappings editable list
            const inputList = $("#node-input-inputMappings-list").css({
                'min-height': '120px',
                'min-width': '450px'
            }).editableList({
                addItem: function(container, i, data) {
                    const row = $('<div/>', { style: "display:flex; align-items:center; gap:5px;" }).appendTo(container);

                    $('<input/>', {
                        type: "text",
                        placeholder: "field name",
                        class: "input-name"
                    })
                    .css({ width: "25%", flex: "0 0 auto" })
                    .val(data.name || "")
                    .appendTo(row);

                    $('<span/>', { style: "flex: 0 0 auto;" }).text(" ← ").appendTo(row);

                    const topicInput = $('<input/>', {
                        type: "text",
                        placeholder: "cache key",
                        class: "input-topic"
                    })
                    .css({ flex: "1 1 auto" })
                    .val(data.topic || "")
                    .appendTo(row);

                    topicInput.autocomplete({
                        source: cachedKeys,
                        minLength: 0,
                        delay: 0
                    }).on("focus", function() {
                        if (!$(this).val()) {
                            $(this).autocomplete("search", "");
                        }
                    });
                },
                removable: true,
                sortable: true,
                addButton: true
            });

            if (node.inputMappings && node.inputMappings.length > 0) {
                node.inputMappings.forEach(function(m) {
                    inputList.editableList('addItem', m);
                });
            } else {
                inputList.editableList('addItem', { name: 'sensor_a', topic: '' });
                inputList.editableList('addItem', { name: 'sensor_b', topic: '' });
            }
        },
        oneditsave: function() {
            const node = this;
            node.inputMappings = [];

            $("#node-input-inputMappings-list").editableList('items').each(function() {
                const name = $(this).find(".input-name").val().trim();
                const topic = $(this).find(".input-topic").val().trim();
                if (name && topic) {
                    node.inputMappings.push({ name: name, topic: topic });
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="dataops-combine">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-cache"><i class="fa fa-database"></i> Cache</label>
        <input type="text" id="node-input-cache">
    </div>
    <div class="form-row">
        <label style="width:100%;"><i class="fa fa-sign-in"></i> Input Mappings</label>
        <ol id="node-input-inputMappings-list"></ol>
        <div class="form-tips">Map output field names to cache keys. Each field receives the cached payload for that key.</div>
    </div>
    <div class="form-row">
        <label for="node-input-joinKey"><i class="fa fa-link"></i> Join Key</label>
        <input type="text" id="node-input-joinKey" placeholder="e.g. id or order_id">
        <div class="form-tips">Field path within each payload that must match for messages to be combined. Leave empty to skip key matching.</div>
    </div>
    <div class="form-row">
        <label for="node-input-windowMs"><i class="fa fa-clock-o"></i> Time Window (ms)</label>
        <input type="number" id="node-input-windowMs" placeholder="0">
        <div class="form-tips">Max time difference between oldest and newest message. 0 = no window constraint.</div>
    </div>
    <div class="form-row">
        <label for="node-input-outputTopic"><i class="fa fa-bookmark"></i> Output Topic</label>
        <input type="text" id="node-input-outputTopic" placeholder="dataops/combined">
    </div>
    <div class="form-row">
        <label for="node-input-table"><i class="fa fa-table"></i> Table</label>
        <input type="text" id="node-input-table" placeholder="e.g. measurements_wide">
        <div class="form-tips">Sets <code>msg._table</code> on the output message for database routing.</div>
    </div>
    <div class="form-row">
        <label for="node-input-triggerMode"><i class="fa fa-bolt"></i> Trigger Mode</label>
        <select id="node-input-triggerMode" style="width:70%;">
            <option value="event">Event — on cache update</option>
            <option value="interval">Interval — regularly</option>
            <option value="external">External — on input message</option>
        </select>
    </div>
    <div class="form-row trigger-interval-row" style="display:none;">
        <label for="node-input-intervalMs"><i class="fa fa-repeat"></i> Interval (ms)</label>
        <input type="number" id="node-input-intervalMs" placeholder="60000">
    </div>
    <div class="form-row trigger-interval-row" style="display:none;">
        <label for="node-input-cronExpr"><i class="fa fa-calendar"></i> Cron Expression</label>
        <input type="text" id="node-input-cronExpr" placeholder="e.g. */5 * * * *">
        <div class="form-tips">If set, uses cron instead of fixed interval. Overrides interval value.</div>
    </div>
</script>

<script type="text/html" data-help-name="dataops-combine">
    <h3>Summary</h3>
    <p>Combines multiple cached messages into one wide message using key-based joining within a time window.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Input Mappings</dt>
        <dd>Map output field names to cache keys. Each field receives the full cached payload for that key.</dd>
        <dt>Join Key</dt>
        <dd>Field path within each payload that must match across all inputs. E.g., if all payloads have an <code>order_id</code> field, set this to <code>order_id</code>.</dd>
        <dt>Time Window</dt>
        <dd>Maximum allowed time difference (ms) between the oldest and newest cached message. 0 = no constraint.</dd>
        <dt>Table</dt>
        <dd>Sets <code>msg._table</code> on output messages — use this to route to a specific database table.</dd>
        <dt>Trigger Mode</dt>
        <dd>
            <ul>
                <li><b>Event</b>: Fire whenever any mapped cache entry updates.</li>
                <li><b>Interval</b>: Fire on a regular interval using latest cached values.</li>
                <li><b>External</b>: Fire only when a message arrives at the input port.</li>
            </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
    <ol>
        <li><b>Combined</b>: The merged message with <code>msg.payload</code> containing all mapped fields.</li>
        <li><b>Status</b>: Join status info and errors.</li>
    </ol>

    <h3>Example</h3>
    <p>If you have two cache entries:</p>
    <pre>
sensor/temp → { device_id: "D1", value: 25.5 }
sensor/hum  → { device_id: "D1", value: 60.2 }
    </pre>
    <p>With mappings <code>temperature ← sensor/temp</code> and <code>humidity ← sensor/hum</code>, join key <code>device_id</code>, the output payload will be:</p>
    <pre>
{
  temperature: { device_id: "D1", value: 25.5 },
  humidity:    { device_id: "D1", value: 60.2 }
}
    </pre>
</script>
