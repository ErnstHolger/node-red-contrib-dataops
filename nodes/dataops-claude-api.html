<script type="text/javascript">
    RED.nodes.registerType('dataops-claude-api', {
        category: 'config',
        defaults: {
            name: { value: "" },
            model: { value: "claude-opus-5-5" },
            baseUrl: { value: "" },
            maxTokens: { value: 16384, validate: RED.validators.number() },
            effort: { value: "" },
            temperature: { value: "", validate: function(v) { return v === undefined || v === null || String(v).trim() === '' || !isNaN(Number(v)); } },
            fallbacks: { value: true }
        },
        credentials: {
            apiKey: { type: "password" }
        },
        label: function() {
            return this.name || "Claude API";
        },
        oneditprepare: function() {
            // Older configs had no fallbacks property: default it on for the Anthropic API only
            // (same rule as the runtime; third-party gateways may reject the beta parameter).
            if (this.fallbacks === undefined) {
                var url = (this.baseUrl || '').trim();
                var isAnthropic = !url || /^https?:\/\/api\.anthropic\.com(\/|$)/.test(url);
                $('#node-config-input-fallbacks').prop('checked', isAnthropic);
            }
        }
    });
</script>

<script type="text/html" data-template-name="dataops-claude-api">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="My Claude API">
    </div>
    <div class="form-row">
        <label for="node-config-input-apiKey"><i class="fa fa-key"></i> API Key</label>
        <input type="password" id="node-config-input-apiKey" placeholder="sk-ant-...">
        <div class="form-tips">Your Anthropic API key. Stored encrypted by Node-RED.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-model"><i class="fa fa-cube"></i> Model</label>
        <input type="text" id="node-config-input-model" placeholder="claude-opus-5-5">
        <div class="form-tips">Model ID, e.g. <code>claude-opus-5-5</code> (default) or <code>claude-sonnet-5-5</code>.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-effort"><i class="fa fa-tachometer"></i> Effort</label>
        <select id="node-config-input-effort" style="width:70%;">
            <option value="">model default</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
        </select>
        <div class="form-tips">Thinking depth vs. token spend. Spec generation usually works well at <code>medium</code>.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-maxTokens"><i class="fa fa-arrow-up"></i> Max Tokens</label>
        <input type="number" id="node-config-input-maxTokens" placeholder="16384">
        <div class="form-tips">Output token cap (thinking included). Raise it if responses come back truncated.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-temperature"><i class="fa fa-thermometer-half"></i> Temperature</label>
        <input type="text" id="node-config-input-temperature" placeholder="(not sent)">
        <div class="form-tips">Leave empty. Current models (Opus 4.7+, Sonnet 5+) reject sampling parameters; set only for older models.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-fallbacks" style="width:auto;">
            <input type="checkbox" id="node-config-input-fallbacks" style="width:auto;vertical-align:top;">
            Refusal fallback
        </label>
        <div class="form-tips">If the model declines a request for policy reasons, retry it on Anthropic's recommended fallback model (server-side). Turn off for proxies that don't support beta features.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
        <input type="text" id="node-config-input-baseUrl" placeholder="https://api.anthropic.com">
        <div class="form-tips">Leave empty for the Anthropic API. Set only for a proxy/gateway.</div>
    </div>
</script>

<script type="text/html" data-help-name="dataops-claude-api">
    <h3>Summary</h3>
    <p>Configuration node for the Claude API, shared by <code>dataops-claude</code> nodes and the <b>DataOps AI</b> sidebar.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>API Key</dt>
        <dd>Anthropic API key (sk-ant-...). Stored encrypted in Node-RED's credential store.</dd>
        <dt>Model</dt>
        <dd>Claude model ID. Default: <code>claude-opus-5-5</code>.</dd>
        <dt>Effort</dt>
        <dd>Optional <code>output_config.effort</code>: low, medium, high, xhigh or max. Empty uses the model's default.</dd>
        <dt>Max Tokens</dt>
        <dd>Maximum output tokens, including thinking. Default: 16384.</dd>
        <dt>Temperature</dt>
        <dd>Optional; only sent when set. Current models return HTTP 400 if it is sent.</dd>
        <dt>Refusal fallback</dt>
        <dd>Sends <code>fallbacks: "default"</code> so a policy decline is retried server-side on a fallback model. Default on.</dd>
        <dt>Base URL</dt>
        <dd>API endpoint. Empty = <code>https://api.anthropic.com</code>. A trailing <code>/v1</code> is accepted.</dd>
    </dl>

    <h3>Notes</h3>
    <p>Requests use the official <code>@anthropic-ai/sdk</code> with streaming, a 5-minute timeout and 2 automatic retries (429, 5xx and connection errors).</p>
    <p>Existing configs keep their saved model and temperature. If you switch an old config to a current model, clear <i>Temperature</i>.</p>
    <p>This config node also powers the <b>DataOps AI</b> sidebar tab, where you can describe a pipeline in plain English and import a generated flow.</p>
</script>

<!-- ===================== DataOps AI sidebar tab ===================== -->
<script type="text/javascript">
(function() {
    if (!RED.sidebar || !RED.sidebar.addTab) return;

    var content = $('<div>', { class: 'dataops-ai-sidebar', style: 'padding:8px;height:100%;box-sizing:border-box;overflow:auto;' });

    $('<p>', { style: 'margin:0 0 8px;color:#777;' })
        .html('Describe a DataOps pipeline in plain English. Claude generates a flow using this package\'s nodes, which you then import onto the canvas.')
        .appendTo(content);

    // API config picker
    var cfgRow = $('<div>', { class: 'form-row', style: 'margin-bottom:6px;' }).appendTo(content);
    $('<label>', { style: 'width:auto;' }).html('<i class="fa fa-key"></i> API Config').appendTo(cfgRow);
    var cfgSelect = $('<select>', { id: 'dataops-ai-config', style: 'width:100%;' }).appendTo(cfgRow);

    // Description box
    var desc = $('<textarea>', {
        id: 'dataops-ai-desc', rows: 5,
        style: 'width:100%;box-sizing:border-box;font-family:monospace;margin-bottom:6px;',
        placeholder: 'e.g. Every 10s read sensor topics into the cache, ask Claude for specs, then normalize live messages with transform.'
    }).appendTo(content);

    var btn = $('<button>', { class: 'red-ui-button', style: 'width:100%;margin-bottom:8px;' })
        .html('<i class="fa fa-magic"></i> Generate flow')
        .appendTo(content);

    var status = $('<div>', { style: 'min-height:18px;color:#777;margin-bottom:6px;font-size:0.85em;' }).appendTo(content);

    // Result preview + import
    var resultBox = $('<div>', { style: 'display:none;' }).appendTo(content);
    var pre = $('<pre>', { style: 'max-height:200px;overflow:auto;background:#f7f7f7;padding:6px;font-size:0.8em;border:1px solid #ddd;' }).appendTo(resultBox);
    var importBtn = $('<button>', { class: 'red-ui-button', style: 'width:100%;' })
        .html('<i class="fa fa-sign-in"></i> Import to canvas').appendTo(resultBox);

    var lastFlow = null;

    function loadConfigs() {
        cfgSelect.empty();
        $.getJSON('dataops/claude/configs').done(function(data) {
            if (!data.configs || !data.configs.length) {
                cfgSelect.append($('<option>', { value: '', text: '(no API config — create one first)' }));
                return;
            }
            data.configs.forEach(function(c) {
                cfgSelect.append($('<option>', { value: c.id, text: c.name }));
            });
        }).fail(function() {
            cfgSelect.append($('<option>', { value: '', text: '(failed to load configs)' }));
        });
    }

    btn.on('click', function() {
        var configId = cfgSelect.val();
        var description = desc.val().trim();
        if (!configId) { status.css('color', '#a00').text('Select an API config (deploy it first).'); return; }
        if (!description) { status.css('color', '#a00').text('Enter a description.'); return; }

        btn.prop('disabled', true);
        resultBox.hide();
        lastFlow = null;
        status.css('color', '#777').html('<i class="fa fa-spinner fa-spin"></i> Asking Claude…');

        $.ajax({
            url: 'dataops/claude/generate-flow', method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ configId: configId, description: description })
        }).done(function(data) {
            lastFlow = data.flow;
            pre.text(JSON.stringify(data.flow, null, 2));
            resultBox.show();
            var tok = data.usage ? (' · ' + data.usage.input_tokens + '→' + data.usage.output_tokens + ' tok') : '';
            status.css('color', '#393').text(data.flow.length + ' nodes generated' + tok);
        }).fail(function(xhr) {
            var msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || 'request failed';
            status.css('color', '#a00').text('Error: ' + msg);
        }).always(function() {
            btn.prop('disabled', false);
        });
    });

    importBtn.on('click', function() {
        if (!lastFlow) return;
        try {
            // Native import: nodes attach to the cursor; user clicks to place. Undo-able.
            RED.view.importNodes(JSON.stringify(lastFlow), { generateIds: true });
            status.css('color', '#393').text('Imported — click on the canvas to place the nodes.');
        } catch (err) {
            status.css('color', '#a00').text('Import failed: ' + err.message);
        }
    });

    RED.sidebar.addTab({
        id: 'dataops-ai',
        name: 'DataOps AI',
        label: 'DataOps AI',
        iconClass: 'fa fa-magic',
        content: content,
        closeable: true,
        onchange: function() { loadConfigs(); }
    });
})();
</script>
