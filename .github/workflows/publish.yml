name: Publish to npm

# Release: bump "version" in package.json, commit, then push a matching tag:
#   git tag v2.1.0 && git push origin v2.1.0
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret and no 2FA
# prompt. One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   GitHub Actions · ErnstHolger/node-red-contrib-dataops · workflow publish.yml
#
# Versions already on npm are skipped, so re-running or re-tagging is harmless.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for trusted publishing (and npm provenance)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run   # publish --dry-run fails on npm 11 once the version exists

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # ships npm 11, which supports trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version and dist-tag
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A pushed tag must match package.json, e.g. v2.0.0 ↔ 2.0.0.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$VERSION" == *"-beta"* ]]; then TAG=beta
          elif [[ "$VERSION" == *"-rc"* ]]; then TAG=next
          else TAG=latest; fi
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.meta.outputs.skip == 'false'
        run: npm publish --tag ${{ steps.meta.outputs.dist_tag }}
